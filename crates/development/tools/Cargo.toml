[package]
name = "indexer-tools"
version = "0.1.0"
edition = "2021"
description = "Tools for Almanac indexer"

[dependencies]
ethers = { version = "2.0", features = ["ws", "rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
eyre = "0.6"
anyhow = "1.0"
indexer-core = { path = "../../infrastructure/core" }
tracing = "0.1"
tracing-subscriber = "0.3"
clap.workspace = true
hex.workspace = true
tempfile = "3.8"

# Configuration management dependencies
toml = "0.8"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }

# Remove rocksdb crate dependency, use direct FFI instead
# rocksdb = "0.21"
libc = "0.2"

[[bin]]
name = "almanac-service"
path = "src/bin/almanac-service.rs"

[[bin]]
name = "test_rocks_only"
path = "src/bin/test_rocks_only.rs"
required-features = ["rocks"]

[features]
default = []
rocks = []

[package]
name = "almanac-services-indexing"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Event indexing services"

[dependencies]
# Infrastructure dependencies
almanac-infrastructure-core = { path = "../../infrastructure/core" }
almanac-infrastructure-storage = { path = "../../infrastructure/storage" }


# Chain dependencies
indexer-cosmos = { path = "../../chains/cosmos", optional = true }
indexer-ethereum = { path = "../../chains/ethereum", optional = true }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

[features]
default = []
cosmos = ["dep:indexer-cosmos"]
ethereum = ["dep:indexer-ethereum"]

[dev-dependencies]
tokio-test = "0.4"
[package]
name = "almanac-tests"
version = "0.1.0"
edition = "2021"
description = "Test suite for Almanac including unit, integration, and e2e tests"

[[bin]]
name = "test-runner"
path = "src/main.rs"

[dependencies]
# Almanac crates
almanac-core = { path = "../crates/almanac-core" }
almanac-storage = { path = "../crates/almanac-storage", features = ["fdb"] }
almanac-chains = { path = "../crates/almanac-chains", features = ["solana", "ethereum", "cosmos"] }
almanac-eventbus = { path = "../crates/almanac-eventbus" }
almanac-api = { path = "../crates/almanac-api" }
almanac-config = { path = "../crates/almanac-config" }

# Test framework
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
borsh = "1.5"

# CLI interaction
clap = { version = "4.5", features = ["derive"] }
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"

# File system and process management
walkdir = "2.4"
regex = "1.10"

# Logging and output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.0"

# JSON/TOML processing
toml = "0.8"

# HTTP client for fetching test data
reqwest = { version = "0.11", features = ["json"] }

# Additional dependencies for new tests
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
foundationdb = { version = "0.8", optional = true, features = ["embedded-fdb-include"] }
# ethers = "2.0"
# cosmrs = "0.14"
# tendermint-rpc = "0.32"
bytes = "1.5"
hex = "0.4"
async-trait = "0.1"
bs58 = "0.4"
sha2 = "0.10"
bincode = "1.3"

# Solana dependencies for real account creation and interaction
solana-client = "~2.3.0"
solana-sdk = "~2.3.0"
solana-program = "~2.3.0"
solana-system-interface = "1.0"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
fdb = ["almanac-storage/fdb", "foundationdb"]
solana = ["almanac-chains/solana"]
cosmos = ["almanac-chains/cosmos"] 
ethereum = ["almanac-chains/ethereum"] 
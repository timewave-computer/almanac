[package]
name = "almanac-chains"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Chain integrations for Almanac"

[dependencies]
# Core types
almanac-core = { path = "../almanac-core" }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

# Chain-specific clients (optional)
# TODO: Enable when valence clients are available
# valence-domain-client-ethereum = { git = "https://github.com/timewave-computer/valence-domain-clients", optional = true }
# valence-domain-client-cosmos = { git = "https://github.com/timewave-computer/valence-domain-clients", optional = true }
# valence-domain-client-solana = { git = "https://github.com/timewave-computer/valence-domain-clients", optional = true }

# Ethereum-specific (optional)
ethers = { version = "2.0", optional = true }

# Cosmos-specific (optional)
cosmrs = { version = "0.14", optional = true }
tendermint-rpc = { version = "0.32", optional = true, features = ["http-client"] }

# Solana-specific (optional) - temporarily disabled due to zeroize conflict
# solana-client = { version = "1.14", optional = true }
# solana-sdk = { version = "1.14", optional = true }
# solana-account-decoder = { version = "1.14", optional = true }
# borsh = { version = "1.3", optional = true }

[features]
default = []
cosmos = ["cosmrs", "tendermint-rpc"]
ethereum = ["ethers"]
# solana = []  # Temporarily disabled due to missing dependencies
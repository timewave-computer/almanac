[package]
name = "almanac-infrastructure-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Core types, traits, and utilities only"

[dependencies]
# Error handling and logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"

# Async runtime
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# Core utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Additional dependencies needed for compilation
regex = "1.0"
notify = "6.0"
toml = "0.8"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "json"], optional = true }
libc = { version = "0.2", optional = true }
axum = { version = "0.7", optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"
tempfile = "3.0"

[features]
default = ["basic"]
basic = []
postgres = ["dep:sqlx"]
rocks = ["dep:libc"]
axum = ["dep:axum"]
cosmos = []
ethereum = []
[package]
name = "almanac-infrastructure-chains"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Shared chain-specific logic"

[dependencies]
# Core infrastructure
almanac-infrastructure-core = { path = "../core" }

# Chain SDKs (optional)
valence-domain-clients = { git = "https://github.com/timewave-computer/valence-domain-clients", branch = "main", optional = true }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

[features]
default = []
cosmos = ["dep:valence-domain-clients"]
ethereum = ["dep:valence-domain-clients"]

[dev-dependencies]
tokio-test = "0.4"
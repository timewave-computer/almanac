version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: almanac-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - almanac-monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: almanac-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.advertise-address=0.0.0.0:9093'
    ports:
      - '9093:9093'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    networks:
      - almanac-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: almanac-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=almanac123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
    ports:
      - '3000:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - almanac-monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: almanac-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    restart: unless-stopped
    networks:
      - almanac-monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: almanac-blackbox-exporter
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    ports:
      - '9115:9115'
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    networks:
      - almanac-monitoring

  # FDB metrics exporter (custom image required)
  fdb-exporter:
    image: almanac/fdb-exporter:latest
    container_name: almanac-fdb-exporter
    environment:
      - FDB_CLUSTER_FILE=/etc/foundationdb/fdb.cluster
    ports:
      - '8091:8091'
    volumes:
      - /etc/foundationdb/fdb.cluster:/etc/foundationdb/fdb.cluster:ro
    restart: unless-stopped
    networks:
      - almanac-monitoring

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local

networks:
  almanac-monitoring:
    driver: bridge
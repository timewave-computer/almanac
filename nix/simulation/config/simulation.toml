# Almanac Simulation Configuration
# Consolidated configuration for local multi-chain simulation environment

[simulation]
name = "almanac-local-cluster"
chains = ["ethereum", "fdb"]

[almanac]
name = "local-simulation"
api_port = 3000
api_log_file = "/Users/hxrts/projects/timewave/almanac/nix/simulation/logs/almanac-api.log"

[storage]
backend = "foundationdb"
cluster_file = "/Users/hxrts/projects/timewave/almanac/nix/simulation/data/fdb.cluster"

[services.foundationdb]
enabled = true
cluster_file = "/Users/hxrts/projects/timewave/almanac/nix/simulation/data/fdb.cluster"
data_dir = "/Users/hxrts/projects/timewave/almanac/nix/simulation/data/foundationdb"
log_dir = "/Users/hxrts/projects/timewave/almanac/nix/simulation/logs/foundationdb"

[services.ethereum]
enabled = true
node_type = "anvil"
rpc_port = 8545
ws_port = 8546
chain_id = 31337
data_dir = "/Users/hxrts/projects/timewave/almanac/nix/simulation/data/ethereum"
log_file = "/Users/hxrts/projects/timewave/almanac/nix/simulation/logs/anvil.log"

[services.cosmos]
enabled = false
node_type = "neutron"
rpc_port = 26657
grpc_port = 9090
api_port = 1317
chain_id = "test-1"
data_dir = "/Users/hxrts/projects/timewave/almanac/nix/simulation/data/cosmos"
log_file = "/Users/hxrts/projects/timewave/almanac/nix/simulation/logs/neutron.log"

[services.solana]
enabled = false
node_type = "test-validator"
rpc_port = 8899
ws_port = 8900
data_dir = "/Users/hxrts/projects/timewave/almanac/nix/simulation/data/solana"
log_file = "/Users/hxrts/projects/timewave/almanac/nix/simulation/logs/solana.log"

[[chains.ethereum]]
name = "ethereum-local"
rpc_url = "http://localhost:8545"
ws_url = "ws://localhost:8546"
chain_id = 31337
starting_block = 1
batch_size = 100

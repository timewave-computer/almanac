# Prometheus configuration for Almanac monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'almanac-prod'
    region: 'us-west-2'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules files
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Almanac metrics
  - job_name: 'almanac'
    static_configs:
      - targets: ['localhost:8090']
        labels:
          service: 'almanac-indexer'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'almanac_.*'
        action: keep

  # FDB metrics (via FDB exporter)
  - job_name: 'fdb'
    static_configs:
      - targets: ['localhost:8091']
        labels:
          service: 'foundationdb'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'fdb_.*'
        action: keep

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'node-exporter'

  # Blackbox exporter for endpoint monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://ethereum-rpc.example.com
          - https://cosmos-rpc.example.com
          - http://localhost:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


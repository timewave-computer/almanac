[package]
name = "almanac-node-ethereum"
version = "0.1.0"
edition = "2021"
authors = ["Timewave"]
repository = "https://github.com/timewave-computer/almanac"
license = "MIT OR Apache-2.0"
description = "Ethereum node binary for Almanac (isolated build)"

# Exclude from parent workspace to prevent dependency conflicts
[workspace]

[[bin]]
name = "almanac-node-ethereum"
path = "src/main.rs"

[dependencies]
# Core almanac dependencies (using path dependencies for isolation)
almanac-core = { path = "../../almanac-core" }
almanac-chains = { path = "../../almanac-chains", features = ["ethereum"], default-features = false }
almanac-consensus = { path = "../../almanac-consensus" }
almanac-indexing = { path = "../../almanac-indexing" }
almanac-storage = { path = "../../almanac-storage" }
almanac-config = { path = "../../almanac-config" }

# Async runtime
tokio = { version = "1.32", features = ["full"] }
async-trait = "0.1.77"
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0.50"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Metrics
prometheus = "0.13"
axum = { version = "0.7", features = ["macros"] }

# Utils
hex = "0.4.3"
bincode = "1.3.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
[package]
name = "almanac-infrastructure-query"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Distributed query planning and execution"

[dependencies]
# Core infrastructure
almanac-infrastructure-core = { path = "../core" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Data structures
dashmap = "5.5"
lru = "0.12"

# Streaming
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Other dependencies
anyhow = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"
[package]
name = "almanac-indexing"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Event indexing service for Almanac"

[[bin]]
name = "almanac-indexing"
path = "src/main.rs"

[dependencies]
# Core dependencies
almanac-core = { path = "../almanac-core" }
almanac-storage = { path = "../almanac-storage" }
almanac-chains = { path = "../almanac-chains" }
almanac-eventbus = { path = "../almanac-eventbus" }

# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
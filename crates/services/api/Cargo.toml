[package]
name = "indexer-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "API interface for the indexer"

[dependencies]
# Internal crates
almanac-infrastructure-core = { path = "../../infrastructure/core", features = ["axum"] }
almanac-infrastructure-storage = { path = "../../infrastructure/storage", features = ["postgres"] }
almanac-infrastructure-query = { path = "../../infrastructure/query" }
almanac-infrastructure-monitoring = { path = "../../infrastructure/monitoring" }
almanac-infrastructure-caching = { path = "../../infrastructure/caching" }
almanac-infrastructure-coordination = { path = "../../infrastructure/coordination" }
indexer-ethereum = { path = "../../chains/ethereum" }
indexer-cosmos = { path = "../../chains/cosmos" }
indexer-tools = { path = "../../development/tools" }

# Async runtime
tokio.workspace = true
futures.workspace = true
tokio-stream = { version = "0.1.14", features = ["sync"] }
async-trait.workspace = true

# Web frameworks
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# GraphQL - removed in favor of REST-only API

# Serialization
serde.workspace = true
serde_json.workspace = true

# Base64 encoding for binary data
base64.workspace = true
bytes.workspace = true

# GraphQL dependencies


# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Logging and error handling
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Authentication and security
jsonwebtoken = "8.3"
bcrypt = "0.15"

# System information
num_cpus = "1.16"

# CLI
clap.workspace = true

# Testing - removed unused dependency

[features]
default = ["postgres"]
postgres = []
rocks = []

[[bin]]
name = "almanac"
path = "src/bin/almanac.rs"


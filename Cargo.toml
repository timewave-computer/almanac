[workspace]
resolver = "2"
members = [
    # Core components
    "crates/almanac-core",
    "crates/almanac-api",
    "crates/almanac-storage",
    "crates/almanac-eventbus",
    "crates/almanac-config",
    "crates/almanac-chains",
    "crates/almanac-consensus",
    "crates/almanac-indexing",
    "crates/almanac-testing",
    
    
    # Chain-specific node binaries
    "crates/almanac-nodes/ethereum",
    "crates/almanac-nodes/cosmos",
    # "crates/almanac-nodes/solana",  # Temporarily disabled due to dependency issues
    
    # E2E tests
    "e2e",
]

# Note: Workspace manifests don't support features.
# Chain support features are defined in individual crates:
# - cosmos: available in indexer-cosmos, indexer-core, indexer-storage
# - ethereum: available in indexer-ethereum, indexer-core, indexer-storage



[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Timewave"]
repository = "https://github.com/timewave-computer/almanac"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"
async-trait = "0.1.77"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
hex = "0.4.3"
bincode = "1.3.3"

# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0.50"
anyhow = "1.0"

# Storage
foundationdb = { version = "0.8", features = ["embedded-fdb-include"] }

# API
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["trace", "cors"] }


# CLI
clap = { version = "4.4", features = ["derive"] }

# Utility
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
bytes = "1.4"
base64 = "0.22"
serde_yaml = "0.9"

# Traverse dependencies
traverse-core = { git = "https://github.com/timewave-computer/traverse", rev = "78b85c8e3714d04a17dd01151a03a43d6b53a768" }
traverse-cosmos = { git = "https://github.com/timewave-computer/traverse", rev = "78b85c8e3714d04a17dd01151a03a43d6b53a768" }
traverse-valence = { git = "https://github.com/timewave-computer/traverse", rev = "78b85c8e3714d04a17dd01151a03a43d6b53a768" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

 
[package]
name = "almanac-testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Testing utilities for Almanac"

[features]
default = []
proptest = ["dep:proptest"]

[dependencies]
# Core dependencies
almanac-core = { path = "../almanac-core" }
almanac-storage = { path = "../almanac-storage" }
almanac-chains = { path = "../almanac-chains" }
almanac-indexing = { path = "../almanac-indexing" }
almanac-eventbus = { path = "../almanac-eventbus" }
almanac-consensus = { path = "../almanac-consensus" }

# Async runtime
tokio = { workspace = true, features = ["test-util", "macros"] }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Testing
proptest = { version = "1.0", optional = true }
tempfile = "3.9"
uuid = { workspace = true }
chrono = { workspace = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
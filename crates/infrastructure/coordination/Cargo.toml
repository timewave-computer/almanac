[package]
name = "almanac-infrastructure-coordination"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Distributed coordination services"

[dependencies]
# Core infrastructure
almanac-infrastructure-core = { path = "../core" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Data structures
dashmap = "5.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
chrono = "0.4"

# Logging
tracing = "0.1"

# File watching
notify = "6.0"

[dev-dependencies]
tokio-test = "0.4"
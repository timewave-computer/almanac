groups:
  - name: almanac_system_alerts
    interval: 30s
    rules:
      # System resource alerts
      - alert: HighCPUUsage
        expr: almanac_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected (instance {{ $labels.instance }})"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"
          runbook_url: "https://almanac.docs/runbooks/high-cpu"

      - alert: CriticalCPUUsage
        expr: almanac_cpu_usage_percent > 95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical CPU usage detected (instance {{ $labels.instance }})"
          description: "CPU usage is {{ $value }}% (threshold: 95%)"
          runbook_url: "https://almanac.docs/runbooks/critical-cpu"

      - alert: HighMemoryUsage
        expr: almanac_memory_usage_percent > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected (instance {{ $labels.instance }})"
          description: "Memory usage is {{ $value }}% (threshold: 85%)"
          runbook_url: "https://almanac.docs/runbooks/high-memory"

      - alert: CriticalMemoryUsage
        expr: almanac_memory_usage_percent > 95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical memory usage detected (instance {{ $labels.instance }})"
          description: "Memory usage is {{ $value }}% (threshold: 95%)"
          runbook_url: "https://almanac.docs/runbooks/critical-memory"

  - name: almanac_event_processing_alerts
    interval: 30s
    rules:
      - alert: EventProcessingSlowdown
        expr: rate(almanac_events_processed_total[5m]) < 100
        for: 10m
        labels:
          severity: warning
          component: event_processor
        annotations:
          summary: "Event processing rate is low"
          description: "Processing only {{ $value }} events/sec (expected: >100)"
          runbook_url: "https://almanac.docs/runbooks/event-processing-slowdown"

      - alert: EventProcessingStopped
        expr: rate(almanac_events_processed_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: event_processor
        annotations:
          summary: "Event processing has stopped"
          description: "No events processed in the last 5 minutes"
          runbook_url: "https://almanac.docs/runbooks/event-processing-stopped"

      - alert: HighEventProcessingLatency
        expr: histogram_quantile(0.99, rate(almanac_event_processing_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: event_processor
        annotations:
          summary: "High event processing latency"
          description: "P99 latency is {{ $value }}s (threshold: 1s)"
          runbook_url: "https://almanac.docs/runbooks/high-event-latency"

      - alert: EventQueueBacklog
        expr: almanac_queue_depth > 10000
        for: 5m
        labels:
          severity: warning
          component: event_processor
        annotations:
          summary: "Event queue backlog detected"
          description: "Queue depth is {{ $value }} (threshold: 10000)"
          runbook_url: "https://almanac.docs/runbooks/queue-backlog"

  - name: almanac_storage_alerts
    interval: 30s
    rules:
      - alert: HighStorageErrorRate
        expr: rate(almanac_storage_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "High storage error rate"
          description: "Storage errors: {{ $value }} errors/sec"
          runbook_url: "https://almanac.docs/runbooks/storage-errors"

      - alert: StorageOperationSlowdown
        expr: histogram_quantile(0.99, rate(almanac_storage_operation_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "Storage operations are slow"
          description: "P99 storage latency is {{ $value }}s (threshold: 0.5s)"
          runbook_url: "https://almanac.docs/runbooks/storage-latency"

  - name: almanac_health_alerts
    interval: 30s
    rules:
      - alert: ComponentUnhealthy
        expr: almanac_component_health_status == 0
        for: 2m
        labels:
          severity: critical
          component: health
        annotations:
          summary: "Component {{ $labels.component }} is unhealthy"
          description: "Component has been unhealthy for 2 minutes"
          runbook_url: "https://almanac.docs/runbooks/component-unhealthy"

      - alert: MultipleComponentsUnhealthy
        expr: count(almanac_component_health_status == 0) > 2
        for: 1m
        labels:
          severity: critical
          component: health
        annotations:
          summary: "Multiple components are unhealthy"
          description: "{{ $value }} components are currently unhealthy"
          runbook_url: "https://almanac.docs/runbooks/multiple-components-unhealthy"

      - alert: HighRestartRate
        expr: rate(almanac_component_restarts_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
          component: health
        annotations:
          summary: "High component restart rate"
          description: "Components restarting {{ $value }} times/hour"
          runbook_url: "https://almanac.docs/runbooks/high-restart-rate"

  - name: almanac_chain_alerts
    interval: 30s
    rules:
      - alert: ChainSyncFallingBehind
        expr: almanac_chain_blocks_behind_head > 100
        for: 10m
        labels:
          severity: warning
          component: chain_sync
        annotations:
          summary: "Chain {{ $labels.chain }} sync falling behind"
          description: "{{ $value }} blocks behind head (threshold: 100)"
          runbook_url: "https://almanac.docs/runbooks/chain-sync-behind"

      - alert: ChainDisconnected
        expr: almanac_chain_connection_status != 1
        for: 2m
        labels:
          severity: critical
          component: chain_sync
        annotations:
          summary: "Chain {{ $labels.chain }} disconnected"
          description: "Chain connection has been down for 2 minutes"
          runbook_url: "https://almanac.docs/runbooks/chain-disconnected"

      - alert: ChainReorgDetected
        expr: increase(almanac_chain_reorg_events_total[1h]) > 5
        for: 1m
        labels:
          severity: warning
          component: chain_sync
        annotations:
          summary: "Multiple chain reorganizations detected"
          description: "{{ $value }} reorgs in the last hour on {{ $labels.chain }}"
          runbook_url: "https://almanac.docs/runbooks/chain-reorgs"

  - name: almanac_fdb_alerts
    interval: 30s
    rules:
      - alert: FDBHighConflictRate
        expr: rate(fdb_conflict_retries_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: fdb
        annotations:
          summary: "High FDB conflict rate"
          description: "{{ $value }} conflicts/sec (threshold: 100)"
          runbook_url: "https://almanac.docs/runbooks/fdb-conflicts"

      - alert: FDBStorageNearCapacity
        expr: (fdb_storage_used_bytes / fdb_storage_total_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
          component: fdb
        annotations:
          summary: "FDB storage near capacity"
          description: "Storage is {{ $value }}% full (threshold: 85%)"
          runbook_url: "https://almanac.docs/runbooks/fdb-storage-capacity"

      - alert: FDBProcessDown
        expr: fdb_process_status != 1
        for: 2m
        labels:
          severity: critical
          component: fdb
        annotations:
          summary: "FDB process {{ $labels.process }} is down"
          description: "Process has been down for 2 minutes"
          runbook_url: "https://almanac.docs/runbooks/fdb-process-down"

  - name: almanac_api_alerts
    interval: 30s
    rules:
      - alert: HighAPIErrorRate
        expr: (rate(almanac_http_requests_total{status_code=~"5.."}[5m]) / rate(almanac_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API error rate"
          description: "Error rate is {{ $value }}% (threshold: 5%)"
          runbook_url: "https://almanac.docs/runbooks/api-errors"

      - alert: APIResponseTimeSlow
        expr: histogram_quantile(0.99, rate(almanac_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API response time is slow"
          description: "P99 response time is {{ $value }}s (threshold: 2s)"
          runbook_url: "https://almanac.docs/runbooks/api-latency"

      - alert: GraphQLQuerySlow
        expr: histogram_quantile(0.99, rate(almanac_graphql_query_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: graphql
        annotations:
          summary: "GraphQL queries are slow"
          description: "P99 query time is {{ $value }}s (threshold: 5s)"
          runbook_url: "https://almanac.docs/runbooks/graphql-latency"
[package]
name = "almanac-infrastructure-monitoring"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Distributed monitoring and observability"

[dependencies]
# Core infrastructure
almanac-infrastructure-core = { path = "../core" }

# Metrics
prometheus = "0.13"
metrics = "0.21"

# System info
sys-info = "0.9"
sysinfo = "0.30"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
futures = "0.3"
chrono = "0.4"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
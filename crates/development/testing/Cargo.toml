[package]
name = "indexer-testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Comprehensive testing framework for the indexer"

[dependencies]
# Internal crates
indexer-core = { path = "../../infrastructure/core" }
indexer-storage = { path = "../../infrastructure/storage" }

# FoundationDB for distributed testing
# foundationdb = { version = "0.8", optional = true }  # Disabled due to missing system dependencies

# Async runtime
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }
async-trait = { workspace = true }

# Testing frameworks
proptest = "1.0"
quickcheck = "1.0"
quickcheck_macros = "1.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"], optional = true }
tokio-test = "0.4"
mock_instant = "0.3"
wiremock = "0.5"

# Database testing
testcontainers = { version = "0.22", features = ["blocking"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }

# Chaos engineering features - implemented internally

# HTTP testing
reqwest = { version = "0.11", features = ["json"] }
hyper = "0.14"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
tempfile = "3.8"

# Performance testing
pprof = { version = "0.13", features = ["flamegraph"], optional = true }
memory-stats = "1.0"
num_cpus = "1.0"

# Load testing  
async-std = { version = "1.12", optional = true }
surf = { version = "2.3", optional = true }

[dev-dependencies]
# Additional test utilities
rstest = "0.18"
once_cell = "1.19"
lazy_static = "1.4"

[features]
default = ["property", "performance"]
# integration = ["dep:foundationdb"]  # Disabled due to missing system dependencies
property = []
chaos = []
performance = ["pprof", "async-std", "surf"]
benchmarks = ["criterion"]
full = ["property", "chaos", "performance", "benchmarks"]

# Benchmarks are defined in the benchmarks module
# Use: cargo test --package indexer-testing --features benchmarks
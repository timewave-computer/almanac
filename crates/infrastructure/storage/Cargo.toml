[package]
name = "indexer-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "run_rocks_benchmark"
path = "src/bin/run_rocks_benchmark.rs"
required-features = ["rocks"]

[[bin]]
name = "test_rocks_transactions"
path = "src/bin/test_rocks_transactions.rs"
required-features = ["rocks"]

[[bin]]
name = "test_ethereum_adapter"
path = "src/bin/test_ethereum_adapter.rs"
required-features = ["postgres"]

[[bin]]
name = "test_cosmos_adapter"
path = "src/bin/test_cosmos_adapter.rs"
required-features = ["postgres"]

[[bin]]
name = "test_chain_reorg"
path = "src/bin/test_chain_reorg.rs"
required-features = ["postgres"]

[dependencies]
# Workspace dependencies
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "macros", "uuid", "time", "chrono"], optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
num_cpus.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
# Remove the problematic rocksdb crate dependency and add FFI dependencies
# rocksdb = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
bincode.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
bytes.workspace = true
base64.workspace = true

# Internal crates
indexer-core = { path = "../core" }

# Explicit versioned dependencies (Only those NOT in workspace)
rand = "0.8.5"
tempfile = "3.9.0"
redis = { version = "0.24", features = ["tokio-comp"], optional = true }
valence-domain-clients = { git = "https://github.com/timewave-computer/valence-domain-clients", branch = "main", optional = true }
# foundationdb = { version = "0.8", optional = true }  # Disabled due to missing system dependencies

[dev-dependencies]
# Keep these explicit as they are dev-only
tempfile = "3.9.0"
rand = "0.8.5"
criterion = { version = "0.5.1", features = ["async_tokio"] }
proptest = "1.4.0"
testcontainers = "0.22.0"
dockertest = "0.5.0"

[features]
# Include dependencies used in the storage crate
default = ["memory", "advanced"]

# Chain support features
cosmos = ["indexer-core/cosmos", "dep:valence-domain-clients"]
ethereum = ["indexer-core/ethereum", "dep:valence-domain-clients"]

# Storage backends
memory = []
postgres = ["indexer-core/postgres", "sqlx"]
rocks = ["indexer-core/rocks", "dep:libc"]
# fdb = ["dep:foundationdb", "indexer-core/fdb"]  # Disabled due to missing system dependencies

# Full feature set
full = ["memory", "postgres", "rocks", "advanced", "cosmos", "ethereum"]

# Additional features
advanced = ["dep:redis", "compression"]
compression = ["indexer-core/compression"]

# Development features  
dev-fixtures = []
test-utils = []

# Offline mode for SQLx
offline = [] 
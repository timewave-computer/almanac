[package]
name = "almanac-chains"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Chain integrations for Almanac"

[lints]
workspace = true

[dependencies]
# Core types
almanac-core = { path = "../almanac-core" }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
base64 = { workspace = true }

# Compression
flate2 = "1.0"

# Cryptographic primitives
sha2 = { workspace = true }
bincode = { workspace = true }


# Chain-specific clients (optional)
# Valence domain clients for cross-chain execution
# TODO: Re-enable when valence-domain-clients repository structure is confirmed
# valence-domain-client-ethereum = { git = "https://github.com/timewave-computer/valence-domain-clients", optional = true }
# valence-domain-client-cosmos = { git = "https://github.com/timewave-computer/valence-domain-clients", optional = true }
# valence-domain-client-solana = { git = "https://github.com/timewave-computer/valence-domain-clients", optional = true }

# Ethereum-specific (optional)
ethers = { version = "2.0", optional = true }

# Cosmos-specific (optional)
cosmrs = { version = "0.20", optional = true }
tendermint = { version = "0.32", optional = true }
tendermint-rpc = { version = "0.32", optional = true, features = ["http-client"] }

# Solana-specific (optional) - for real Geyser integration  
solana-client = { version = "~2.3.0", optional = true }
solana-sdk = { version = "~2.3.0", optional = true }
solana-merkle-tree = { version = "~2.3.0", optional = true }
solana-sha256-hasher = { version = "~2.2.0", optional = true }
# solana-account-decoder = { version = "~2.3.0", optional = true }
# solana-geyser-plugin-interface = { version = "~1.18.0", optional = true }
yellowstone-grpc-client = { version = "=8.0.0", optional = true }
yellowstone-grpc-proto = { version = "=8.0.0", optional = true }
tonic = { version = "0.10", optional = true }
borsh = { version = "1.5", optional = true }
anchor-lang = { version = "0.31", optional = true }

[features]
default = []
cosmos = ["cosmrs", "tendermint", "tendermint-rpc"]
ethereum = ["ethers"]
solana-core = [
    "solana-client", 
    "solana-sdk", 
    "solana-merkle-tree",
    "solana-sha256-hasher",
    "borsh",
    "anchor-lang"
]
solana = [
    "solana-core",
    # gRPC dependencies for Geyser streaming
    "yellowstone-grpc-client",
    "yellowstone-grpc-proto", 
    "tonic",
]
valence = []
valence-ethereum = ["ethereum"]
valence-cosmos = ["cosmos"]
valence-solana = ["solana"]

# Valence domain client features (disabled pending repository verification)
# valence = ["valence-ethereum", "valence-cosmos", "valence-solana"]
# valence-ethereum = ["valence-domain-client-ethereum", "ethereum"]
# valence-cosmos = ["valence-domain-client-cosmos", "cosmos"]
# valence-solana = ["valence-domain-client-solana", "solana"]

[dev-dependencies]
almanac-storage = { path = "../almanac-storage" }
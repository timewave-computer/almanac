[package]
name = "almanac-infrastructure-caching"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Distributed caching infrastructure"

[dependencies]
almanac-infrastructure-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
chrono = "0.4"
bytes = "1.5"
flate2 = { version = "1.0", optional = true }
regex = "1.0"
lru = { version = "0.12", optional = true }
lz4_flex = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true }
rmp-serde = "1.1"
async-trait = "0.1"
redis = { version = "0.24", features = ["tokio-comp"], optional = true }
md5 = { version = "0.7", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"], optional = true }
dashmap = "5.5"

[features]
default = ["compression", "lru-cache", "hashing"]
compression = ["dep:flate2", "dep:lz4_flex", "dep:zstd"]
lru-cache = ["dep:lru"]
redis = ["dep:redis"]
hashing = ["dep:md5", "dep:xxhash-rust"]
advanced = ["compression", "lru-cache", "redis", "hashing"]

[dev-dependencies]
tokio-test = "0.4"
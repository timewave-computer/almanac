# Development environment configuration

[api]
host = "127.0.0.1"
port = 8080
enable_http = true


[storage]
foundationdb_cluster_file = "/usr/local/etc/foundationdb/fdb.cluster"
foundationdb_namespace = "almanac_dev"

[ethereum]
rpc_url = "http://localhost:8545"
chain_id = "1337" # Anvil local chain
start_block = 0
batch_size = 50
polling_interval_ms = 1000
finality_blocks = 0

[cosmos]
rpc_url = "http://localhost:26657"
chain_id = "ufo-local-1"
start_block = 0
batch_size = 50
polling_interval_ms = 1000

[logging]
level = "debug"
file = "./logs/indexer_dev.log"
console = true

[metrics]
enable = true
host = "127.0.0.1"
port = 9090

[auth]
# External authentication service configuration
service_url = "http://localhost:8888/v1/auth"
# Request timeout in milliseconds
timeout_ms = 5000
# Cache TTL for validated tokens in seconds
cache_ttl_seconds = 300
# Enable authentication (set to false to bypass auth)
enabled = true 
# Production environment configuration

[api]
host = "0.0.0.0"  # Listen on all interfaces
port = 8080
enable_http = true

[storage]
foundationdb_cluster_file = "/usr/local/etc/foundationdb/fdb.cluster"
foundationdb_namespace = "almanac_prod"

[ethereum]
rpc_url = "${ETH_RPC_URL}"
chain_id = "1"  # Ethereum mainnet
start_block = 0
batch_size = 100
polling_interval_ms = 2000
finality_blocks = 20  # Wait 20 blocks for finality on mainnet

[cosmos]
rpc_url = "${COSMOS_RPC_URL}"
chain_id = "cosmoshub-4"  # Cosmos Hub mainnet
start_block = 0
batch_size = 100
polling_interval_ms = 2000

[logging]
level = "info"
file = "/var/log/indexer/indexer.log"
console = false  # Only log to file in production

[metrics]
enable = true
host = "127.0.0.1"  # Only expose metrics on localhost
port = 9090 